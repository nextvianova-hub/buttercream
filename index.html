<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Buttercream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Abhaya+Libre:wght@600;800&family=Noto+Sans+Sinhala:wght@400;500;700&family=Noto+Sans+Tamil:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F3EA; --surface:#FFFFFF; --tile:#15120D; --ink:#1B1712; --muted:#6F6250;
  --gold:#A87E2E; --gold-hi:#F3DC9C; --gold-mid:#D3A64A; --gold-lo:#8E6620;
  --line:#E4D6BA; --soft:#F1E8D6; --band:#0D0B08;
  --ok:#2E7D5B; --err:#B3261E;
  --display:"Cinzel","Abhaya Libre",Georgia,serif;
  --si-display:"Abhaya Libre","Noto Sans Tamil","Iskoola Pota",Georgia,serif;
  --body:"Noto Sans Sinhala","Noto Sans Tamil","Iskoola Pota",system-ui,sans-serif;
  --goldgrad:linear-gradient(180deg,var(--gold-hi) 0%,var(--gold-mid) 52%,var(--gold-lo) 100%);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0B08; --surface:#17140F; --tile:#1F1A13; --ink:#F4ECDD; --muted:#B4A68C;
    --gold:#D9B15C; --line:#3A3021; --soft:#221C14;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0B08; --surface:#17140F; --tile:#1F1A13; --ink:#F4ECDD; --muted:#B4A68C;
  --gold:#D9B15C; --line:#3A3021; --soft:#221C14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-mid);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
.goldtext{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Hero ---------- */
.hero{background:var(--band);color:#F4ECDD;text-align:center;padding:30px 0 34px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:120%;background:radial-gradient(closest-side,rgba(211,166,74,.22),transparent);pointer-events:none}
.logo-ring{width:132px;height:132px;margin:0 auto 14px;border-radius:50%;padding:3px;background:var(--goldgrad);position:relative;box-shadow:0 0 0 6px var(--band),0 0 0 7px rgba(211,166,74,.45)}
.logo-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,7.5vw,3.1rem);letter-spacing:.06em;line-height:1.1;margin:6px 0 2px}
.hero .sub{font-family:var(--display);font-weight:500;letter-spacing:.32em;font-size:.82rem;color:var(--gold-mid)}
.hero p.tag{margin:14px auto 0;max-width:36ch;color:#D9CCB3}
.flourish{display:block;width:220px;max-width:70%;height:18px;margin:14px auto 0;color:var(--gold-mid)}
@media (prefers-reduced-motion:no-preference){
  .logo-ring{animation:glow 1.1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes glow{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
}
.infobar{background:var(--band);border-top:1px solid rgba(211,166,74,.35);color:#D9CCB3;font-size:.92rem}
.infobar .wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;padding-top:10px;padding-bottom:12px}
.infobar a{text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.infobar svg{width:16px;height:16px;color:var(--gold-mid);flex:none}

/* ---------- Menu ---------- */
.menu-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 6px}
.menu-head h2{font-family:var(--si-display);font-size:1.8rem;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 16px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--band);color:var(--gold-hi);border-color:var(--gold-mid)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding-bottom:120px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line);text-align:left;padding:0;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover:not(:disabled){border-color:var(--gold-mid)}
.card:disabled{opacity:.5;cursor:not-allowed}
.thumb{aspect-ratio:1/1;background:var(--tile);display:grid;place-items:center;overflow:hidden;color:var(--gold-mid);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:44%;height:44%}
.thumb.placeholder::after{content:"";position:absolute;inset:10px;border:1px solid rgba(211,166,74,.28);border-radius:10px}
.card .info{padding:11px 13px 14px}
.card .name{font-weight:700;line-height:1.35}
.card .price{color:var(--gold);font-weight:700;margin-top:3px}
.card .soldout{font-size:.85rem;color:var(--muted)}

.cartbar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:10}
.cartbar button{pointer-events:auto;width:100%;max-width:520px;background:var(--band);color:var(--gold-hi);border:1px solid var(--gold-mid);border-radius:16px;padding:14px 20px;display:flex;justify-content:space-between;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.35)}

/* ---------- Sheets ---------- */
.backdrop{position:fixed;inset:0;background:rgba(8,6,3,.62);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--gold-mid)}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:24px;max-height:88%;border:1px solid var(--gold-mid)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}}
.sheet h2{font-family:var(--si-display);font-size:1.9rem;line-height:1.15;margin:0 0 6px}
.sheet .bigthumb{border-radius:16px;aspect-ratio:4/3;margin-bottom:16px}
.sheet .bigthumb svg{width:30%;height:30%}
.close{float:right;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;font-size:1.1rem;line-height:1;position:relative;z-index:2}
.muted{color:var(--muted)}
label{display:block;font-weight:500;margin:14px 0 6px}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=password],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px}
input:focus,textarea:focus,select:focus{border-color:var(--gold-mid);outline:none;box-shadow:0 0 0 3px rgba(211,166,74,.25)}
textarea{min-height:76px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 14px}
.opt[aria-pressed="true"]{border-color:var(--gold-mid);background:var(--soft);font-weight:700;color:var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:4px}
.stepper button{border:0;background:var(--surface);width:34px;height:34px;border-radius:50%;font-size:1.2rem;font-weight:700}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;background:var(--goldgrad);color:#1B1408;width:100%;margin-top:18px;letter-spacing:.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line);box-shadow:none}
.btn.small{width:auto;padding:8px 14px;margin:0;font-size:.92rem}
.danger{color:var(--err) !important}
.err{color:var(--err);font-size:.92rem;margin-top:8px}
.line{padding:12px 0;border-bottom:1px solid var(--line)}
.total{font-family:var(--si-display);font-size:1.6rem;font-weight:800}

/* ---------- Footer ---------- */
footer.site{background:var(--band);color:#D9CCB3;margin-top:10px;padding:30px 0 120px;text-align:center}
footer.site .fname{font-family:var(--display);font-size:1.3rem;letter-spacing:.06em}
footer.site address{font-style:normal;margin:10px 0}
.contact-btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.contact-btns a{text-decoration:none;border:1px solid var(--gold-mid);color:var(--gold-hi);border-radius:12px;padding:9px 16px;font-weight:500}
footer.site .owner{font-size:.9rem;color:#A99A7E}
footer.site .admin-link{background:none;border:0;color:#7E7058;text-decoration:underline;font-size:.85rem;margin-top:18px}

/* ---------- Admin ---------- */
.topbar{background:var(--band);color:#F4ECDD;padding:12px 0;border-bottom:1px solid rgba(211,166,74,.4)}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar .brand img{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold-mid)}
.topbar h1{font-family:var(--si-display);font-size:1.3rem;margin:0}
.topbar button{background:transparent;border:1px solid rgba(211,166,74,.6);color:var(--gold-hi);border-radius:10px;padding:6px 12px}
.tabs{display:flex;gap:6px;margin:18px 0}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);padding:11px;border-radius:12px;font-weight:700}
.tab[aria-selected="true"]{background:var(--band);color:var(--gold-hi);border-color:var(--gold-mid)}
.badge{display:inline-block;background:var(--goldgrad);color:#1B1408;border-radius:999px;padding:0 8px;margin-left:6px;font-size:.82rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.ord-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.ord-no{font-family:var(--display);font-size:1.4rem;font-weight:700;color:var(--gold)}
.status{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:700}
.st-new{background:#F6E7C1;color:#6B4A0E}
.st-making{background:#E9DDF7;color:#4B2A80}
.st-ready{background:#D3F0E2;color:#1D6B49}
.st-done{background:var(--soft);color:var(--muted)}
.st-cancel{background:#F8DEDC;color:#8C1D18}
.st-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.item-row{display:flex;gap:12px;align-items:center}
.item-row .mini{width:58px;height:58px;border-radius:12px;flex:none}
.item-row .mini svg{width:60%;height:60%}
.item-row .mini.placeholder::after{display:none}
.item-row .grow{flex:1;min-width:0}
.toggle{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:500}
.toggle input{width:22px;height:22px;accent-color:var(--gold-mid)}
.note{background:var(--soft);border-left:3px solid var(--gold-mid);border-radius:10px;padding:12px 14px;font-size:.92rem;margin:14px 0}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.done-logo{width:96px;height:96px;border-radius:50%;margin:0 auto 8px;border:2px solid var(--gold-mid)}
.section-title{font-family:var(--si-display);font-size:1.3rem;margin:0 0 4px}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold-mid);margin:0 auto 12px;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn:disabled{opacity:.6;cursor:wait}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.lang{border:1px solid rgba(211,166,74,.45);background:transparent;color:#D9CCB3;border-radius:999px;padding:5px 12px;font-size:.85rem;line-height:1.3;min-height:32px}
.lang[aria-pressed="true"]{background:var(--goldgrad);color:#1B1408;border-color:transparent;font-weight:700}
.lang:hover{border-color:var(--gold-mid)}
.admin-cup{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin-top:18px;border-radius:50%;border:1px solid rgba(211,166,74,.35);background:transparent;color:var(--gold-mid);opacity:.55;transition:opacity .15s,border-color .15s}
.admin-cup:hover,.admin-cup:focus-visible{opacity:1;border-color:var(--gold-mid)}
</style>
</head>

async function loadShop(){
  if(!sb){ state.loadError = "loadErr"; render(); return; }
  const [set, items] = await Promise.all([
    sb.from("shop_settings").select("data").eq("id",1).maybeSingle(),
    sb.from("menu_items").select("*").order("sort_order").order("created_at")
  ]);
  if(items.error){ state.loadError = "loadErr"; render(); return; }
  state.settings = {...DEFAULT_SETTINGS, ...(set.data?.data || {})};
  state.items = items.data || [];
  state.loaded = true;
  render();
}

async function loadOrders(){
  ui.ordersLoading = true;
  const {data, error} = await sb.from("orders").select("*").order("needed_date").order("order_no");
  ui.ordersLoading = false;
  if(error){ ui.ordersError = t("errOrders") + error.message; }
  else { ui.ordersError = ""; state.orders = data || []; }
  if(ui.view==="admin" && !ui.sheet) render();
}

async function checkAdmin(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return false;
  const {data, error} = await sb.rpc("is_admin");
  return !error && data === true;
}

let pollTimer = null;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(()=>{ if(ui.admin && ui.view==="admin" && ui.tab==="orders" && !document.hidden) loadOrders(); }, 30000);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

function render(){
  document.title = state.settings.shopName;

  else html = ui.view === "admin" && ui.admin ? adminView() : shopView();
  $("#app").innerHTML = html + sheetView();
}

/* ===== පින්තූර කුඩා කිරීම ===== */
function resizeImage(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.onload = () => {
      const max = 900, s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      const dataUrl = c.toDataURL("image/jpeg",0.8);
      c.toBlob(b => b ? res({blob:b, dataUrl}) : rej(new Error("blob")), "image/jpeg", 0.8);
    };
    img.src = url;
  });
}
const storagePath = url => {
  const m = String(url||"").split(`/object/public/${BUCKET}/`)[1];
  return m ? decodeURIComponent(m.split("?")[0]) : null;
};

document.addEventListener("change", async e=>{

  if(e.key==="Enter" && (e.target.id==="lpass"||e.target.id==="lemail")) act("do-login", e.target);

document.addEventListener("click", e=>{

  if(!el) return;
  if(el.dataset.act==="backdrop" && e.target!==el) return;

});

async function act(a, el){
  const d = el.dataset;
  if(ui.busy && !["cat"].includes(a)) return;
  switch(a){
    case "reload": state.loadError=""; render(); loadShop(); return;
    case "lang": setLang(d.id); break;
    case "cat": ui.cat=d.id; break;
    case "open-item": ui.sheet={kind:"item",id:d.id,qty:1,weight:1,message:""}; break;
    case "weight": ui.sheet.weight=Number(d.w); break;
    case "qty": ui.sheet.qty=Math.min(50,Math.max(1,ui.sheet.qty+Number(d.d))); break;
    case "add-to-cart":{
      const it=itemById(ui.sheet.id), s=ui.sheet;
      ui.cart.push({itemId:it.id,name:it.name,qty:s.qty,weight:it.is_cake?s.weight:null,message:it.is_cake?s.message.trim():"",unitPrice:it.is_cake?it.price*s.weight:Number(it.price)});
      ui.sheet=null; break;}
    case "open-cart": ui.sheet={kind:"cart",form:{}}; break;
    case "remove-line": readCartForm(); ui.cart.splice(Number(d.i),1); break;
    case "place-order":{
      readCartForm(); const f=ui.sheet.form;
      if(!f.name){ui.sheet.error="errName";break;}
      if(!/^[0-9+\s-]{9,15}$/.test(f.phone)){ui.sheet.error="errPhone";break;}
      if(!f.date){ui.sheet.error="errDate";break;}
      ui.busy=true; ui.sheet.error=""; render();
      const {data, error} = await sb.rpc("place_order", {
        p_name:f.name, p_phone:f.phone, p_date:f.date, p_note:f.note,
        p_lines: ui.cart.map(l=>({item_id:l.itemId, qty:l.qty, weight:l.weight, message:l.message}))
      });
      ui.busy=false;
      if(error){
        ui.sheet.error = /unavailable/.test(error.message)
          ? "errUnavailable"
          : "errOrder";
        if(/unavailable/.test(error.message)) loadShop();
        break;
      }
      ui.lastOrder={no:data, date:f.date, phone:f.phone};
      ui.cart=[]; ui.sheet={kind:"done"}; break;}
    case "close": case "backdrop": if(!ui.busy) ui.sheet=null; break;

    case "admin-login":
      if(await checkAdmin()){ ui.admin=true; ui.view="admin"; window.scrollTo(0,0); loadOrders(); startPolling(); }
      else ui.sheet={kind:"login"};
      break;
    case "do-login":{
      const email=$("#lemail").value.trim(), password=$("#lpass").value;
      ui.sheet.email=email;
      if(!email||!password){ ui.sheet.error="errBoth"; break; }
      ui.busy=true; ui.sheet.error=""; render();
      const {error} = await sb.auth.signInWithPassword({email,password});
      if(error){ ui.busy=false; ui.sheet.error="errLogin"; break; }
      const ok = await checkAdmin();
      ui.busy=false;
      if(!ok){ await sb.auth.signOut(); ui.sheet.error="errNotAdmin"; break; }
      ui.admin=true; ui.view="admin"; ui.sheet=null; window.scrollTo(0,0);
      loadOrders(); startPolling();
      break;}
    case "logout": await sb.auth.signOut(); ui.admin=false; ui.view="shop"; state.orders=[]; stopPolling(); break;
    case "view-shop": ui.view="shop"; break;
    case "tab": ui.tab=d.id; if(d.id==="orders") loadOrders(); break;
    case "ord-filter": ui.ordFilter=d.id; break;
    case "refresh-orders": loadOrders(); break;
    case "set-status":{
      const o=state.orders.find(x=>x.id===d.id); const prev=o.status;
      o.status=d.st; render();
      const {error} = await sb.from("orders").update({status:d.st}).eq("id",d.id);
      if(error){ o.status=prev; ui.ordersError=t("errStatus")+error.message; }
      break;}

    case "new-item": ui.sheet={kind:"edit",isNew:true,draft:{cat:"cake",name:"",description:"",price:"",image_url:"",available:true,is_cake:true,sort_order:(Math.max(0,...state.items.map(i=>i.sort_order||0))+1)}}; break;
    case "edit-item": ui.sheet={kind:"edit",isNew:false,draft:{...itemById(d.id)}, oldImage:itemById(d.id).image_url}; break;
    case "remove-img": readEditFields(); ui.sheet.draft.image_url=""; ui.sheet.draft.preview=""; ui.sheet.draft.newBlob=null; break;
    case "save-item":{
      readEditFields(); const dr=ui.sheet.draft;
      if(!dr.name){ui.sheet.error=t("errItemName");break;}
      if(!(dr.price>0)){ui.sheet.error=t("errPrice");break;}
      ui.busy=true; ui.sheet.error=""; render();
      let imageUrl = dr.image_url || "";
      if(dr.newBlob){
        const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
        const up = await sb.storage.from(BUCKET).upload(path, dr.newBlob, {contentType:"image/jpeg", cacheControl:"31536000"});
        if(up.error){ ui.busy=false; ui.sheet.error=t("errUpload")+up.error.message; break; }
        imageUrl = sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
      }
      const row = {cat:dr.cat, name:dr.name, description:dr.description, price:dr.price, image_url:imageUrl, is_cake:dr.is_cake, available:dr.available, sort_order:dr.sort_order||0};
      const res = ui.sheet.isNew
        ? await sb.from("menu_items").insert(row).select().single()
        : await sb.from("menu_items").update(row).eq("id",dr.id).select().single();
      ui.busy=false;
      if(res.error){ ui.sheet.error=t("errSave")+res.error.message; break; }
      const old = storagePath(ui.sheet.oldImage);
      if(old && ui.sheet.oldImage!==imageUrl) sb.storage.from(BUCKET).remove([old]);
      if(ui.sheet.isNew) state.items.push(res.data);
      else state.items = state.items.map(i=>i.id===res.data.id?res.data:i);
      ui.sheet=null; break;}
    case "delete-item":{
      if(!confirm(t("confirmDelete"))) return;
      const dr=ui.sheet.draft; ui.busy=true; render();
      const {error} = await sb.from("menu_items").delete().eq("id",dr.id);
      ui.busy=false;
      if(error){ ui.sheet.error=t("errDelete")+error.message; break; }
      const old = storagePath(ui.sheet.oldImage); if(old) sb.storage.from(BUCKET).remove([old]);
      state.items = state.items.filter(x=>x.id!==dr.id); ui.sheet=null; break;}
    case "save-settings":{
      const next = {...state.settings,
        shopName:$("#sname").value.trim()||state.settings.shopName, subtitle:$("#ssub").value.trim(),
        tagline:$("#stag").value.trim(), tagline_en:$("#stagen").value.trim(), tagline_ta:$("#stagta").value.trim(), address:$("#saddr").value.trim(),
        phone:$("#sphone").value.trim(), owner:$("#sowner").value.trim()};
      const {error} = await sb.from("shop_settings").update({data:next}).eq("id",1);
      if(error){ $("#smsg").innerHTML=`<div class="err">${esc(t("errSave")+error.message)}</div>`; return; }
      state.settings = next; render();
      $("#smsg").innerHTML=`<div style="color:var(--ok);margin-top:8px">${t("saved")}</div>`; return;}
    case "change-pass":{
      const p1=$("#np1").value, p2=$("#np2").value;
      if(p1.length<8){ $("#pmsg").innerHTML=`<div class="err">${t("errPassLen")}</div>`; return; }
      if(p1!==p2){ $("#pmsg").innerHTML=`<div class="err">${t("errPassMatch")}</div>`; return; }
      const {error} = await sb.auth.updateUser({password:p1});
      $("#np1").value=""; $("#np2").value="";
      $("#pmsg").innerHTML = error ? `<div class="err">${esc(t("errPassChange")+error.message)}</div>` : `<div style="color:var(--ok);margin-top:8px">${t("passChanged")}</div>`;
      return;}
  }
  render();
  if(a==="admin-login" && ui.sheet) setTimeout(()=>$("#lemail")?.focus(),50);
}

loadShop();
})();
</script>
</body>
</html>
